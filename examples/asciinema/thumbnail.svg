    <svg x="8.42333333" y="9.333331000000001" class="default-text-fill">

      <text xml:space="preserve" class="term-text" style="fill: #cdd0d6">
        <tspan y="0.0">
          <tspan dy="1em" x="0.0" class="br" style="fill: #64bc69">me@laptop</tspan><tspan x="75.80999997">:</tspan><tspan x="84.2333333" class="br" style="fill: #68a2ec">~/coliru</tspan><tspan x="151.61999994">$ # List tags in manifest file:                                         </tspan>
        </tspan><tspan y="18.666662000000002">
          <tspan dy="1em" x="0.0" class="br" style="fill: #64bc69">me@laptop</tspan><tspan x="75.80999997">:</tspan><tspan x="84.2333333" class="br" style="fill: #68a2ec">~/coliru</tspan><tspan x="151.61999994">$ coliru examples/basic/manifest.yml --list-tags                        </tspan>
        </tspan><tspan y="37.333324000000005">
          <tspan dy="1em" x="0.0">linux                                                                                     </tspan>
        </tspan><tspan y="55.99998600000001">
          <tspan dy="1em" x="0.0">macos                                                                                     </tspan>
        </tspan><tspan y="74.66664800000001">
          <tspan dy="1em" x="0.0">windows                                                                                   </tspan>
        </tspan><tspan y="93.33331000000001">
          <tspan dy="1em" x="0.0" class="br" style="fill: #64bc69">me@laptop</tspan><tspan x="75.80999997">:</tspan><tspan x="84.2333333" class="br" style="fill: #68a2ec">~/coliru</tspan><tspan x="151.61999994">$ # Install dotfiles on local machine:                                  </tspan>
        </tspan><tspan y="111.99997200000001">
          <tspan dy="1em" x="0.0" class="br" style="fill: #64bc69">me@laptop</tspan><tspan x="75.80999997">:</tspan><tspan x="84.2333333" class="br" style="fill: #68a2ec">~/coliru</tspan><tspan x="151.61999994">$ coliru examples/basic/manifest.yml --tag-rules linux                  </tspan>
        </tspan><tspan y="130.66663400000002">
          <tspan dy="1em" x="0.0" class="br">[1/2]</tspan><tspan x="42.11666665"> Copy gitconfig to ~/.gitconfig                                                      </tspan>
        </tspan><tspan y="149.33329600000002">
          <tspan dy="1em" x="0.0" class="br">[2/2]</tspan><tspan x="42.11666665"> Link bashrc to ~/.bashrc                                                            </tspan>
        </tspan><tspan y="167.99995800000002">
          <tspan dy="1em" x="0.0" class="br">[2/2]</tspan><tspan x="42.11666665"> Link vimrc to ~/.vimrc                                                              </tspan>
        </tspan><tspan y="186.66662000000002">
          <tspan dy="1em" x="0.0" class="br">[2/2]</tspan><tspan x="42.11666665"> Run sh ./script.sh arg1 linux                                                       </tspan>
        </tspan><tspan y="205.33328200000003">
          <tspan dy="1em" x="0.0">This is script.sh, called on laptop with args &quot;arg1 linux&quot;                                </tspan>
        </tspan><tspan y="223.99994400000003">
          <tspan dy="1em" x="0.0" class="br" style="fill: #64bc69">me@laptop</tspan><tspan x="75.80999997">:</tspan><tspan x="84.2333333" class="br" style="fill: #68a2ec">~/coliru</tspan><tspan x="151.61999994">$ # Install dotfiles on remote machine:                                 </tspan>
        </tspan><tspan y="242.66660600000003">
          <tspan dy="1em" x="0.0" class="br" style="fill: #64bc69">me@laptop</tspan><tspan x="75.80999997">:</tspan><tspan x="84.2333333" class="br" style="fill: #68a2ec">~/coliru</tspan><tspan x="151.61999994">$ coliru examples/basic/manifest.yml --tag-rules linux --host pi@rpi    </tspan>
        </tspan><tspan y="261.33326800000003">
          <tspan dy="1em" x="0.0" class="br">[1/2]</tspan><tspan x="42.11666665"> Copy gitconfig to pi@rpi:~/.gitconfig                                               </tspan>
        </tspan><tspan y="279.99993">
          <tspan dy="1em" x="0.0" class="br">[2/2]</tspan><tspan x="42.11666665"> Copy bashrc to pi@rpi:~/.bashrc                                                     </tspan>
        </tspan><tspan y="298.66659200000004">
          <tspan dy="1em" x="0.0" class="br">[2/2]</tspan><tspan x="42.11666665"> Copy vimrc to pi@rpi:~/.vimrc                                                       </tspan>
        </tspan><tspan y="317.333254">
          <tspan dy="1em" x="0.0" class="br">[2/2]</tspan><tspan x="42.11666665"> Copy script.sh to pi@rpi:~/.coliru/script.sh                                        </tspan>
        </tspan><tspan y="335.99991600000004">
          <tspan dy="1em" x="0.0" class="br">[2/2]</tspan><tspan x="42.11666665"> Run sh ./script.sh arg1 linux on pi@rpi                                             </tspan>
        </tspan><tspan y="354.666578">
          <tspan dy="1em" x="0.0">This is script.sh, called on rpi with args &quot;arg1 linux&quot;                                   </tspan>
        </tspan><tspan y="373.33324000000005">
          <tspan dy="1em" x="0.0" class="br" style="fill: #64bc69">me@laptop</tspan><tspan x="75.80999997">:</tspan><tspan x="84.2333333" class="br" style="fill: #68a2ec">~/coliru</tspan><tspan x="151.61999994">$ </tspan><tspan x="168.4666666" style="fill: #191c22"> </tspan><tspan x="176.88999993000002">                                                                     </tspan>
        </tspan><tspan y="391.999902">
          <tspan dy="1em" x="0.0">                                                                                          </tspan>
